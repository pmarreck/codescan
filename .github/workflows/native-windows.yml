name: native-windows

on:
  push:
    branches: [yolo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Nix
        shell: bash
        run: ./scripts/ci-setup-nix
      - name: Prepare Windows test products
        shell: bash
        run: |
          nix build --no-link --keep-going .#cancellation-mswin-amd64 .#cancellation-mswin-arm64 .#cancellation-mswin-amd64-unpatched .#cancellation-mswin-arm64-unpatched .#test-binaries-mswin-amd64 .#test-binaries-mswin-arm64 .#test-git-mswin-amd64 .#test-git-mswin-arm64 .#release-mswin-amd64 .#release-mswin-arm64
          mkdir -p cancellation-mswin-amd64 cancellation-mswin-arm64 cancellation-unpatched-mswin-amd64 cancellation-unpatched-mswin-arm64
          for arch in amd64 arm64; do
            product="$(nix path-info ".#cancellation-mswin-$arch")"
            for extension in exe pdb; do
              cp "$product/bin/codescan-cancellation-tests.$extension" "cancellation-mswin-$arch/"
            done
            original_product="$(nix path-info ".#cancellation-mswin-$arch-unpatched")"
            for extension in exe pdb; do
              cp "$original_product/bin/codescan-cancellation-tests.$extension" "cancellation-unpatched-mswin-$arch/"
            done
            unit_product="$(nix path-info ".#test-binaries-mswin-$arch")"
            mkdir -p "unit-mswin-$arch"
            for extension in exe pdb; do
              cp "$unit_product/bin/codescan-unit-tests.$extension" "unit-mswin-$arch/"
            done
            git_product="$(nix path-info ".#test-git-mswin-$arch")"
            mkdir -p "git-mswin-$arch"
            ALLOW_NIX_STORE_COPY='Export complete declared Windows CI test tools' cp -R "$git_product/." "git-mswin-$arch/"
            case "$arch" in
              amd64) release_target=x86_64-windows-gnu ;;
              arm64) release_target=aarch64-windows-gnu ;;
            esac
            nix develop -c ./scripts/ci-build "$release_target" "codescan-mswin-$arch" "codescan-mswin-$arch.zip" .exe
          done
      - uses: actions/upload-artifact@v6
        with:
          name: cancellation-mswin-amd64
          path: cancellation-mswin-amd64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: cancellation-mswin-arm64
          path: cancellation-mswin-arm64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: cancellation-unpatched-mswin-amd64
          path: cancellation-unpatched-mswin-amd64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: cancellation-unpatched-mswin-arm64
          path: cancellation-unpatched-mswin-arm64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: unit-mswin-amd64
          path: unit-mswin-amd64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: unit-mswin-arm64
          path: unit-mswin-arm64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: git-mswin-amd64
          path: git-mswin-amd64/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: git-mswin-arm64
          path: git-mswin-arm64/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: release-mswin-amd64
          path: codescan-mswin-amd64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: release-mswin-arm64
          path: codescan-mswin-arm64.zip
          if-no-files-found: error

  qualify:
    needs: prepare
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: amd64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: cancellation-mswin-${{ matrix.arch }}
          path: cancellation
      - name: Validate qualification controls
        shell: pwsh
        run: ./tests/unit/test-windows-cancellation.ps1
      - uses: actions/download-artifact@v7
        with:
          name: cancellation-unpatched-mswin-${{ matrix.arch }}
          path: cancellation-unpatched
      - name: Reproduce the original-library reset mapping failure
        shell: pwsh
        run: |
          ./scripts/ci-test-windows.ps1 -Suite cancellation-unpatched -Architecture "${{ matrix.arch }}" -Executable "./cancellation-unpatched/codescan-cancellation-tests.exe"
      - uses: actions/download-artifact@v7
        with:
          name: unit-mswin-${{ matrix.arch }}
          path: unit
      - uses: actions/download-artifact@v7
        with:
          name: git-mswin-${{ matrix.arch }}
          path: git-tools
      - name: Execute native aggregate unit tests
        shell: pwsh
        run: |
          ./scripts/ci-test-windows.ps1 -Suite unit -Architecture "${{ matrix.arch }}" -Executable "./unit/codescan-unit-tests.exe" -GitExecutable "./git-tools/cmd/git.exe"
      - uses: actions/download-artifact@v7
        with:
          name: release-mswin-${{ matrix.arch }}
          path: release-archive
      - name: Extract complete release product
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "./release-archive/codescan-mswin-${{ matrix.arch }}.zip" -DestinationPath './release product with spaces'
      - name: Execute native release copy
        shell: pwsh
        run: |
          ./scripts/ci-test-windows.ps1 -Suite release -Architecture "${{ matrix.arch }}" -Executable "./release product with spaces/codescan-mswin-${{ matrix.arch }}/bin/codescan.exe"
      - name: Execute native cancellation tests
        shell: pwsh
        run: |
          foreach ($iteration in 1..20) {
            Write-Output "Native cancellation iteration $iteration/20"
            ./scripts/ci-test-windows.ps1 -Architecture "${{ matrix.arch }}" -Executable "./cancellation/codescan-cancellation-tests.exe"
          }
